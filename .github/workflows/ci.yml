name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check plugin/dist is committed and up to date
        run: |
          if [ -n "$(git status --porcelain plugin/dist)" ]; then
            echo "plugin/dist is stale — run 'npm run build' and commit the result." >&2
            git status --porcelain plugin/dist >&2
            exit 1
          fi
